name: Log Copilot Issue

on:
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  log-issue:
    if: contains(github.event.issue.assignees[*].login, 'copilot') || contains(github.event.issue.labels[*].name, 'copilot')
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Log Session Start
        run: |
          echo "{\"sessionId\":\"gh-issue-${{ github.event.issue.number }}\",\"source\":\"copilot\"}" | bash .github/hooks/log-session-start.sh

      - name: Log Issue Assignment as Tool
        run: |
          PAYLOAD=$(cat <<'EOF'
          {
            "sessionId": "gh-issue-${{ github.event.issue.number }}",
            "toolName": "github_issue_assign",
            "toolArgs": {
              "issueNumber": ${{ github.event.issue.number }},
              "issueTitle": "${{ github.event.issue.title }}",
              "repository": "${{ github.repository }}"
            }
          }
          EOF
          )
          echo "$PAYLOAD" | bash .github/hooks/log-tool-use.sh
